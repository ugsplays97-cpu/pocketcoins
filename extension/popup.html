<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Pocket Coins</title>
  <style>
    html, body { margin: 0; background: #12141c; }
    body { width: 360px; min-height: 500px; }
    body.win { width: auto; }
    iframe { display: block; width: 100%; height: 500px; border: 0; }
    body.win iframe { height: 100vh; }
    #wait { position: fixed; inset: 0; display: grid; place-items: center; }
    #wait i { width: 36px; height: 36px; border-radius: 50%; border: 4px solid #232738; border-top-color: #ffd24a; animation: r .9s linear infinite; }
    @keyframes r { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="wait"><i></i></div>
  <iframe id="game" title="Pocket Coins" allow="clipboard-write"></iframe>
  <script src="config.js"></script>
  <script src="shell.js"></script>
</body>
</html>
